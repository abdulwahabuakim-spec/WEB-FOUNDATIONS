<!DOCTYPE html>
<html>
<head>
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Your clean and professional notes app</p>
  </header>

  <main>
    <form id="note-form">
      <input type="text" placeholder="Enter note title" />
      <textarea placeholder="Enter note content"></textarea>
      <button type="submit">Add Note</button>
    </form>

    <section class="notes-container">
      <div class="note">
        <h2>Welcome Note</h2>
        <p>This is a sample note styled with CSS.</p>
      </div>
      <div class="note">
        <h2>Second Note</h2>
        <p>Learning box model, flexbox and responsive design.</p>
      </div>
    </section>
  </main>
</body>
</html>

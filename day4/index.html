<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 4 - Live Counter & Dark Mode</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Quick Notes</h1>
      <button id="theme-toggle">Dark mode</button>
    </header>

    <label for="note-text">Your note:</label>
    <textarea id="note-text" placeholder="Start typing..."></textarea>

    <div class="stats">
      <p id="char-count">0 / 200 characters</p>
      <p id="word-count">0 words</p>
    </div>

    <button id="clear-btn">Clear</button>
  </div>
</body>
</html>
